name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3
    # Cache the cargo registry + target directory across runs so repeated
    # builds/tests don't recompile the whole dependency tree.
    - uses: Swatinem/rust-cache@v2
    - name: Check
      run: cargo check --all-targets --all-features
    # The sandbox unit test (/agent/tools/subprocess) routes a real `bash`
    # tool call through the `ri-sandbox` child; build the bins first so the
    # child exists. Integration tests in tests/ use CARGO_BIN_EXE_ri-sandbox
    # (also handled by cargo, but building here keeps it unambiguous).
    - name: Build binaries (incl. ri-sandbox child)
      run: cargo build --bins
    - name: Run tests
      run: cargo test --all-features
    - name: Check format
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  # Supply-chain audit: fail the build if any crate in Cargo.lock has a known
  # vulnerability or has been yanked from crates.io.
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3
    - uses: Swatinem/rust-cache@v2
    - uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  # Release build of the static musl binary, uploaded as a build artifact so
  # every push produces a directly runnable single-file executable.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3
    - name: Install musl target
      run: rustup target add x86_64-unknown-linux-musl
    - uses: Swatinem/rust-cache@v2
    - name: Build release binary
      run: cargo build --release --target x86_64-unknown-linux-musl
    - uses: actions/upload-artifact@v4
      with:
        name: ri-linux-musl
        path: target/x86_64-unknown-linux-musl/release/ri
