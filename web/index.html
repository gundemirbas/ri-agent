<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ri · Agent Client Protocol v2</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel2: #1c212b;
    --border: #2a3140;
    --text: #dbe2ec;
    --muted: #8b95a7;
    --accent: #4cc38a;
    --user: #1f6feb;
    --tool: #2b3140;
    --error: #f2706f;
    --warn: #e0b565;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .logo { font-weight: 700; letter-spacing: .5px; color: var(--accent); }
  header .pill {
    font-size: 11px; border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 9px; color: var(--muted); background: var(--panel2);
    white-space: nowrap;
  }
  header .pill.good { color: var(--accent); border-color: var(--accent); }
  header .pill.bad  { color: var(--error); border-color: var(--error); }
  header .spacer { flex: 1; }
  header label { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  header input#cwd {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; width: 220px; font-size: 12px;
  }
  main {
    flex: 1; overflow-y: auto; padding: 18px 16px 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 78%; display: flex; flex-direction: column; gap: 2px; }
  .msg.user  { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .bubble {
    border-radius: 12px; padding: 9px 12px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 3px; }
  .msg.assistant .bubble { background: var(--panel2); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .bubble.streaming::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  .meta { font-size: 11px; color: var(--muted); padding: 0 4px; }
  .meta .model-badge { color: var(--accent); }
  details.tool {
    margin-top: 6px; align-self: flex-start; min-width: 260px; max-width: 86%;
    background: var(--tool); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  details.tool summary {
    cursor: pointer; padding: 7px 10px; font-size: 12px; list-style: none;
    display: flex; align-items: center; gap: 8px; color: var(--muted);
  }
  details.tool summary::-webkit-details-marker { display: none; }
  details.tool summary .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  details.tool summary .dot.pending     { background: var(--warn); }
  details.tool summary .dot.in_progress { background: var(--accent); animation: blink 1s steps(2) infinite; }
  details.tool summary .dot.completed   { background: var(--accent); }
  details.tool summary .dot.error       { background: var(--error); }
  details.tool summary .name { font-family: ui-monospace, monospace; color: var(--text); }
  details.tool pre {
    margin: 0; padding: 8px 12px; border-top: 1px solid var(--border);
    white-space: pre-wrap; word-break: break-word; font-size: 12px; color: #cdd6e3;
    background: #10141b; max-height: 260px; overflow: auto;
  }
  .thought {
    align-self: flex-start; font-size: 12px; color: var(--muted); font-style: italic;
    max-width: 78%; border-left: 2px solid var(--border); padding-left: 10px; white-space: pre-wrap;
  }
  .usage { font-size: 11px; color: var(--muted); align-self: center; }

  #perm {
    display: none; position: sticky; bottom: 8px; align-self: center;
    background: var(--panel2); border: 1px solid var(--warn); border-radius: 12px;
    padding: 10px 12px; max-width: 90%; box-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  #perm .title { font-size: 13px; margin-bottom: 6px; white-space: pre-wrap; }
  #perm .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel2); color: var(--text); padding: 5px 12px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #06281a; border-color: var(--accent); font-weight: 600; }
  label.check { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  footer.composer {
    border-top: 1px solid var(--border); background: var(--panel);
    padding: 10px 14px; display: flex; gap: 10px; align-items: flex-end;
  }
  textarea#input {
    flex: 1; resize: none; min-height: 42px; max-height: 180px;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font: inherit;
  }
  textarea:focus, input:focus, button:focus { outline: 1px solid var(--accent); }
  footer.composer .hint { font-size: 11px; color: var(--muted); align-self: center; }
  .error-line { color: var(--error); white-space: pre-wrap; }
  .conn-line { color: var(--muted); font-size: 12px; align-self: center; }
</style>
</head>
<body>
<header>
  <span class="logo">ri · ξ</span>
  <span id="status" class="pill bad">connecting…</span>
  <span id="proto" class="pill">ACP v2</span>
  <span id="model" class="pill">model…</span>
  <span id="session" class="pill">no session</span>
  <span class="spacer"></span>
  <label>workspace <input id="cwd" type="text" value="/" spellcheck="false" /></label>
</header>

<main id="log"><div class="conn-line">Connecting to the ri ACP server (protocol v2)…</div></main>

<div id="perm">
  <div class="title" id="permTitle"></div>
  <div class="opts" id="permOpts"></div>
  <label class="check"><input type="checkbox" id="autoAllow" checked /> auto-approve permission prompts</label>
</div>

<footer class="composer">
  <textarea id="input" placeholder="Message the agent… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
  <button id="send" class="primary" disabled>Send</button>
  <button id="stop" style="display:none">■ Stop</button>
  <span class="hint" id="usage"></span>
</footer>

<script src="/app.js"></script>
</body>
</html>
